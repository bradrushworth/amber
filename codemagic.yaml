# Reconstructed from the Codemagic dashboard "Default Workflow" (Flutter
# Workflow Editor) on 2026-08-21, so the CI config is versioned with the code.
#
# IMPORTANT: the Codemagic app currently builds via the Workflow Editor, so
# this file is inert documentation until the app is switched to
# "codemagic.yaml" in App settings. Before switching, wire up the credentials
# that the editor stores internally (they do NOT carry over to YAML builds):
#   - Upload keystore.jks (key alias "upload") under Team settings >
#     Code signing identities with reference name "keystore_reference".
#   - Put the Google Play service-account JSON (the editor uses
#     api-4901704154908871926-...json) into an environment group
#     "google_play" as GCLOUD_SERVICE_ACCOUNT_CREDENTIALS.
#   - The App Store Connect integration "Codemagic Nuptial Flight"
#     (key 75423D3XRN) is already a team integration; referenced by name.
#   - Codemagic Static Pages (amberelectric.codemagic.app) is a workflow
#     editor feature with no YAML equivalent; web publishing needs the
#     dashboard or another host.
workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - keystore_reference
      ios_signing:
        distribution_type: app_store
        bundle_identifier: au.com.bitbot.amber
      groups:
        - google_play
    integrations:
      app_store_connect: Codemagic Nuptial Flight
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: false
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Flutter test
        script: flutter test
        # Editor setting "Stop build if tests or analysis fail" is OFF for
        # this app, and Play/TestFlight/web publishing all have "publish even
        # if tests fail" ticked.
        ignore_failure: true
      - name: Build AAB (release)
        script: flutter build appbundle --release
      - name: Build IPA (release)
        script: flutter build ipa --release
      - name: Build web (release)
        script: |
          flutter config --enable-web
          flutter build web --release
          cd build/web && 7z a -r ../web.zip ./*
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - build/ios/ipa/*.ipa
      - build/web.zip
    publishing:
      email:
        recipients:
          - brushworth@bitbot.com.au
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: beta
        submit_as_draft: false
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
